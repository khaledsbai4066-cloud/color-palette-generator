<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color-palette-generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
     crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
@import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap');
</style>
</head>
<body>
    <div class="container">
        <h1>Color palette Generator</h1>
        <button id="generate-btn"><i class="fas fa-sync-alt"></i>Generate Palette</button>
        <div class="palette-container">
            <!--BOX1-->
            <div class="color-Box">
                <div class="color" style="background-color: #52b1b1;"></div>
                <div class="color-info">
                    <span class="hex-value">#52B1B1 </span>
                    <i class="far fa-copy copy-BTN" title="copy to clipboard"></i>
                </div>
            </div>

            <!--BOX1-->
            <div class="color-Box">
                <div class="color" style="background-color: #66d8d8;"></div>
                <div class="color-info">
                    <span class="hex-value">#66D8D8 </span>
                    <i class="far fa-copy copy-BTN" title="copy to clipboard"></i>
                </div>
            </div>

            <!--BOX1-->
            <div class="color-Box">
                <div class="color" style="background-color: #7adfdf;"></div>
                <div class="color-info">
                    <span class="hex-value">#7ADFDF </span>
                    <i class="far fa-copy copy-BTN" title="copy to clipboard"></i>
                </div>
            </div>

            <!--BOX1-->
            <div class="color-Box">
                <div class="color" style="background-color: #65dada;"></div>
                <div class="color-info">
                    <span class="hex-value">#65DADA </span>
                    <i class="far fa-copy copy-BTN" title="copy to clipboard"></i>
                </div>
            </div>

            <!--BOX1-->
            <div class="color-Box">
                <div class="color" style="background-color: #3ca5a5;"></div>
                <div class="color-info">
                    <span class="hex-value">#3CA5A5 </span>
                    <i class="far fa-copy copy-BTN" title="copy to clipboard"></i>
                </div>
            </div>


        </div>
        

    </div>

    







    <script src="script.js"></script>
</body>
</html>
